name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      # The sandbox cannot read action logs (they live in blob storage), so a failed build
      # reports its errors as an issue, which is readable through the GitHub API.
      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Build output (tail):'
            echo '```'
            tail -c 50000 build.log
            echo '```'
          } > report.md
          gh issue create --title "Build failure on ${GITHUB_SHA:0:7}" --body-file report.md || true

      - name: Show what was built
        run: ls -la build/libs

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: wotw-tripods
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
